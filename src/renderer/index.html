<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Required on Android so the WebView lays out at device width instead of
         a zoomed-out desktop viewport. No effect on the desktop shells. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ÆTHER</title>
    <link rel="icon" type="image/svg+xml" href="/aether-favicon.svg" />
    <!-- The policy lives in src-tauri/tauri.conf.json under app.security.csp (and
         devCsp), which Tauri injects here at load. It is deliberately not also a
         meta tag: two policies are intersected by the engine, so a stricter one
         added in either place would silently override the other, and the pair
         would drift. See docs/SECURITY.md. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
