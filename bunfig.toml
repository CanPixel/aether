[install]
# Refuse to install any package version published less than 3 days ago.
#
# This is a supply-chain measure, not a stability one. The dangerous window for a
# compromised or typosquatted release is the first hours after it is published,
# before the registry, scanners, and other maintainers have noticed. Waiting three
# days does not make a package safe, but it means someone else is very likely to
# have hit the bad version first.
#
# In seconds: 3 * 24 * 60 * 60.
minimumReleaseAge = 259200

# Packages allowed to bypass the wait. Deliberately empty.
#
# The reason to add one is a genuine emergency — a security patch you need before
# the window closes — and in that case prefer a one-off
# `bun install --minimum-release-age=0` over a permanent hole here, so the
# exemption expires with the command instead of living in the repo.
minimumReleaseAgeExcludes = []
